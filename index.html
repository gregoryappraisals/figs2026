<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>Gregory Sketch</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Gregory Sketch</h1>
    <p>Offline appraisal sketch tool</p>
  </header>

  <main>
    <section class="card controls">
      <label>
        Property / Assignment
        <input id="jobName" placeholder="e.g. 14301 Woolsey Rd" />
      </label>

      <div class="row">
        <label>Feet <input id="feet" type="number" min="0" step="1" value="10" /></label>
        <label>Inches <input id="inches" type="number" min="0" max="11.99" step="0.25" value="0" /></label>
      </div>

      <label>
        Area label
        <select id="areaLabel">
          <option>1st Floor</option>
          <option>2nd Floor</option>
          <option>Garage</option>
          <option>Porch</option>
          <option>Basement</option>
          <option>Office</option>
          <option>Warehouse</option>
          <option>Other</option>
        </select>
      </label>

      <div class="direction-grid">
        <button data-dir="up">↑ Up</button>
        <button data-dir="left">← Left</button>
        <button data-dir="right">Right →</button>
        <button data-dir="down">↓ Down</button>
      </div>

      <div class="row buttons">
        <button id="undoBtn">Undo</button>
        <button id="closeBtn">Close Shape</button>
        <button id="newAreaBtn">New Area</button>
      </div>

      <div class="row buttons">
        <button id="saveBtn">Save Job</button>
        <button id="loadBtn">Load Job</button>
        <button id="exportBtn">Export PNG</button>
        <button id="printBtn">Print / PDF</button>
      </div>

      <div class="summary">
        <strong>Current area:</strong> <span id="currentArea">0 SF</span><br />
        <strong>Total included area:</strong> <span id="totalArea">0 SF</span>
      </div>
    </section>

    <section class="card canvas-wrap">
      <svg id="sketch" viewBox="0 0 900 650" aria-label="Sketch canvas">
        <g id="grid"></g>
        <g id="drawing"></g>
      </svg>
    </section>

    <section class="card">
      <h2>Saved Areas</h2>
      <div id="areasList">No completed areas yet.</div>
    </section>
  </main>

  <footer>Gregory Appraisals, LLC</footer>

  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js");
    }
  </script>
</body>
</html>
